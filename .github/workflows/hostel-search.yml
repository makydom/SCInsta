name: Hostel search

on:
    push:
        branches:
            - 'claude/skyscanner-bangkok-chiang-mai-n89m6d'
        paths:
            - '.github/hostel-search/**'
            - '.github/workflows/hostel-search.yml'

jobs:
    search:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - name: Install
              run: |
                pip install playwright
                python -m playwright install --with-deps chromium
            - name: Search
              run: python .github/hostel-search/search.py
